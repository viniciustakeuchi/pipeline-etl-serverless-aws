# Roda o pipeline completo com Docker Compose (S3 local no lugar da AWS) contra as fontes
# reais do Banco Central e do Tesouro. Serve de canário: se uma fonte mudar de formato,
# este workflow falha antes de a Lambda de produção falhar.
name: Ensaio com dados reais

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1" # segundas, 9h em Brasília

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from pipeline \
            2>&1 | tee ensaio.log
      - name: Resumo
        if: always()
        run: |
          python3 scripts/resumir_ensaio.py ensaio.log | tee resumo.txt
          {
            echo '### Ensaio com dados reais'
            echo '```'
            cat resumo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
